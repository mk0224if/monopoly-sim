<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>

            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;

        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
        
        /* グラフエリア */
        .chart-box {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            background: #fafafa;
            box-sizing: border-box;
        }
        canvas { display: block; margin: 0 auto; }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0;
            font-size: 14px;
            font-weight: bold;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .color-box { width: 18px; height: 18px; border-radius: 3px; }

        /* テーブルエリア */
        .table-title {
            margin-top: 32px;
            margin-bottom: 12px;
            font-size: 18px;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-box {
            max-height: 550px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        th { background: #e9ecef; position: sticky; top: 0; z-index: 10; font-weight: 600; color: #495057; }
        tr:nth-child(even) { background: #f8f9fa; }
        tr:hover { background: #edf2f7; }

        /* 特殊ハイライト */
        .jail-row { background-color: #fff3bf !important; font-weight: bold; }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #fff;
            font-weight: bold;
        }
        .bg-brown { background-color: #8B4513; }
        .bg-light-blue { background-color: #87CEEB; color: #000; }
        .bg-purple { background-color: #DA70D6; }
        .bg-orange { background-color: #FFA500; }
        .bg-red { background-color: #FF0000; }
        .bg-yellow { background-color: #FFD700; color: #000; }
        .bg-green { background-color: #228B22; }
        .bg-dark-blue { background-color: #00008B; }
        .bg-railroad { background-color: #333; }
        .bg-utility { background-color: #708090; }
        .bg-special { background-color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>モノポリー（US版）全40マス 着地確率比較一覧</h1>
    <div class="subtitle">試行回数: 10,000,000 ターン（完全連鎖移動判定・定常分布理論収束値）</div>

    <div class="legend">
        <div class="legend-item">
            <div class="color-box" style="background: #3498db;"></div>
            <span>即時脱出 (Early Exit)</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #e74c3c;"></div>
            <span>ゾロ目狙い (Long Stay)</span>
        </div>
    </div>

    <!-- 自前描画キャンバス -->
    <div class="chart-box">
        <canvas id="customChart" width="1100" height="400"></canvas>
    </div>

    <!-- テーブルエリア -->
    <div class="table-title">
        <span>全40マス データテーブル</span>
        <span style="font-size: 12px; color: #666;">※差分 = ゾロ目狙い - 即時脱出</span>
    </div>
    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">ID</th>
                    <th>日本語場所名</th>
                    <th>英語表記</th>
                    <th>グループ</th>
                    <th style="width: 120px;">即時脱出 (%)</th>
                    <th style="width: 120px;">ゾロ目狙い (%)</th>
                    <th style="width: 100px;">差分 (%)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

// Pure Canvas 描画エンジン
function drawChart() {
    const canvas = document.getElementById("customChart");
    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;
    
    const padding = { top: 30, right: 20, bottom: 40, left: 40 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const maxVal = 12;

    ctx.clearRect(0, 0, width, height);

    // グリッド線描画
    ctx.strokeStyle = "#e0e0e0";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 6; i++) {
        const y = padding.top + chartH - (i / 6) * chartH;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();

        ctx.fillStyle = "#888";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`${(i * 2)}%`, padding.left - 6, y + 3);
    }

    // バーの描画
    const barWidth = (chartW / data.length) / 2 - 1;

    data.forEach((item, index) => {
        const xBase = padding.left + (index * (chartW / data.length));

        // 即時脱出 (Blue)
        const hEarly = (item.early / maxVal) * chartH;
        ctx.fillStyle = "#3498db";
        ctx.fillRect(xBase, padding.top + chartH - hEarly, barWidth, hEarly);

        // ゾロ目狙い (Red)
        const hLong = (item.long / maxVal) * chartH;
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(xBase + barWidth, padding.top + chartH - hLong, barWidth, hLong);

        // X軸ラベル (ID)
        if (index % 2 === 0 || index === 10) {
            ctx.fillStyle = "#555";
            ctx.font = "10px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(item.id, xBase + barWidth, height - 15);
        }
    });
}

// テーブルデータ全40マスの生成
const tbody = document.getElementById("tableBody");
data.forEach(item => {
    const diff = (item.long - item.early).toFixed(3);
    const tr = document.createElement("tr");
    
    if (item.id === 10) tr.classList.add("jail-row");

    tr.innerHTML = `
        <td><strong>${item.id}</strong></td>
        <td><strong>${item.jp}</strong></td>
        <td style="color: #666;">${item.en}</td>
        <td><span class="badge ${item.badge}">${item.group}</span></td>
        <td>${item.early.toFixed(3)}%</td>
        <td>${item.long.toFixed(3)}%</td>
        <td style="color: ${diff > 0 ? '#e74c3c' : (diff < 0 ? '#2980b9' : '#333')}; font-weight: bold;">
            ${diff > 0 ? '+' + diff : diff}%
        </td>
    `;
    tbody.appendChild(tr);
});

// 描画実行
drawChart();
</script>

</body>
</html>
