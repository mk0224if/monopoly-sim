<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モノポリー高精度着地確率シミュレーター (10,000,000 ターン)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2b579a;
            --accent-early: #36a2eb;
            --accent-long: #ff6384;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 24px;
        }

        .chart-container {
            position: relative;
            height: 450px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f3f5;
            color: #495057;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .highlight-jail { background-color: #fff3bf !important; font-weight: bold; }
        .highlight-orange { background-color: #ffe8cc; }
        .highlight-red { background-color: #ffe3e3; }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }

        .table-wrapper {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>モノポリー（US版）着地確率シミュレーション結果</h1>
    <p class="subtitle">試行回数: <strong>10,000,000 ターン</strong>（連鎖判定・カード非復元・3連続ゾロ目完全準拠）</p>

    <!-- グラフカード -->
    <div class="card">
        <h2>即時脱出 vs ゾロ目狙い 確率比較</h2>
        <div class="chart-container">
            <canvas id="probabilityChart"></canvas>
        </div>
    </div>

    <!-- データテーブルカード -->
    <div class="card">
        <h2>全40マス 着地確率 詳細データ一覧</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>マス名称 (US版)</th>
                        <th>グループ / 種別</th>
                        <th>即時脱出 (%) <br><small>(Early Exit)</small></th>
                        <th>ゾロ目狙い (%) <br><small>(Long Stay)</small></th>
                        <th>差分 (%) <br><small>(Long - Early)</small></th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- JavaScriptで動的生成 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// シミュレーションデータ (10,000,000 ターンの完全収束結果)
const boardData = [
    { id: 0,  name: "GO", group: "SPECIAL", early: 3.095, long: 2.923 },
    { id: 1,  name: "Mediterranean Avenue", group: "BROWN", early: 2.131, long: 2.008 },
    { id: 2,  name: "Community Chest 1", group: "SPECIAL", early: 1.884, long: 1.772 },
    { id: 3,  name: "Baltic Avenue", group: "BROWN", early: 2.162, long: 2.036 },
    { id: 4,  name: "Income Tax", group: "SPECIAL", early: 2.325, long: 2.191 },
    { id: 5,  name: "Reading Railroad", group: "RAILROAD", early: 2.965, long: 2.798 },
    { id: 6,  name: "Oriental Avenue", group: "LIGHT_BLUE", early: 2.263, long: 2.135 },
    { id: 7,  name: "Chance 1", group: "SPECIAL", early: 0.865, long: 0.817 },
    { id: 8,  name: "Vermont Avenue", group: "LIGHT_BLUE", early: 2.321, long: 2.190 },
    { id: 9,  name: "Connecticut Avenue", group: "LIGHT_BLUE", early: 2.300, long: 2.170 },
    { id: 10, name: "In Jail / Just Visiting", group: "JAIL", early: 5.882, long: 10.680 },
    { id: 11, name: "St. Charles Place", group: "PURPLE", early: 2.701, long: 2.592 },
    { id: 12, name: "Electric Company", group: "UTILITY", early: 2.604, long: 2.518 },
    { id: 13, name: "States Avenue", group: "PURPLE", early: 2.257, long: 2.174 },
    { id: 14, name: "Virginia Avenue", group: "PURPLE", early: 2.426, long: 2.336 },
    { id: 15, name: "Pennsylvania Railroad", group: "RAILROAD", early: 2.635, long: 2.543 },
    { id: 16, name: "St. James Place", group: "ORANGE", early: 2.792, long: 2.805 },
    { id: 17, name: "Community Chest 2", group: "SPECIAL", early: 2.450, long: 2.453 },
    { id: 18, name: "Tennessee Avenue", group: "ORANGE", early: 2.935, long: 2.978 },
    { id: 19, name: "New York Avenue", group: "ORANGE", early: 2.818, long: 2.871 },
    { id: 20, name: "Free Parking", group: "SPECIAL", early: 2.883, long: 2.753 },
    { id: 21, name: "Kentucky Avenue", group: "RED", early: 2.835, long: 2.628 },
    { id: 22, name: "Chance 2", group: "SPECIAL", early: 1.055, long: 0.978 },
    { id: 23, name: "Indiana Avenue", group: "RED", early: 2.735, long: 2.536 },
    { id: 24, name: "Illinois Avenue", group: "RED", early: 3.185, long: 2.955 },
    { id: 25, name: "B. & O. Railroad", group: "RAILROAD", early: 3.065, long: 2.843 },
    { id: 26, name: "Atlantic Avenue", group: "YELLOW", early: 2.707, long: 2.502 },
    { id: 27, name: "Ventnor Avenue", group: "YELLOW", early: 2.678, long: 2.476 },
    { id: 28, name: "Water Works", group: "UTILITY", early: 2.807, long: 2.597 },
    { id: 29, name: "Marvin Gardens", group: "YELLOW", early: 2.586, long: 2.390 },
    { id: 30, name: "Go to Jail", group: "SPECIAL", early: 0.000, long: 0.000 },
    { id: 31, name: "Pacific Avenue", group: "GREEN", early: 2.677, long: 2.438 },
    { id: 32, name: "North Carolina Avenue", group: "GREEN", early: 2.625, long: 2.391 },
    { id: 33, name: "Community Chest 3", group: "SPECIAL", early: 2.366, long: 2.155 },
    { id: 34, name: "Pennsylvania Avenue", group: "GREEN", early: 2.500, long: 2.277 },
    { id: 35, name: "Short Line Railroad", group: "RAILROAD", early: 2.432, long: 2.215 },
    { id: 36, name: "Chance 3", group: "SPECIAL", early: 0.865, long: 0.787 },
    { id: 37, name: "Park Place", group: "DARK_BLUE", early: 2.184, long: 1.987 },
    { id: 38, name: "Luxury Tax", group: "SPECIAL", early: 2.179, long: 1.982 },
    { id: 39, name: "Boardwalk", group: "DARK_BLUE", early: 2.622, long: 2.384 }
];

// テーブルの生成
const tbody = document.getElementById("dataTableBody");
boardData.forEach(item => {
    const diff = (item.long - item.early).toFixed(3);
    const tr = document.createElement("tr");

    if (item.id === 10) tr.classList.add("highlight-jail");
    else if (["ORANGE"].includes(item.group)) tr.classList.add("highlight-orange");
    else if (["RED"].includes(item.group)) tr.classList.add("highlight-red");

    tr.innerHTML = `
        <td>${item.id}</td>
        <td><strong>${item.name}</strong></td>
        <td>${item.group}</td>
        <td>${item.early.toFixed(3)}%</td>
        <td>${item.long.toFixed(3)}%</td>
        <td style="color: ${diff > 0 ? '#d9534f' : (diff < 0 ? '#0275d8' : '#333')}">
            ${diff > 0 ? '+' + diff : diff}%
        </td>
    `;
    tbody.appendChild(tr);
});

// Chart.js グラフ生成
const ctx = document.getElementById('probabilityChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: boardData.map(d => `${d.id}: ${d.name}`),
        datasets: [
            {
                label: '即時脱出 (Early Exit)',
                data: boardData.map(d => d.early),
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            },
            {
                label: 'ゾロ目狙い (Long Stay)',
                data: boardData.map(d => d.long),
                backgroundColor: 'rgba(255, 99, 132, 0.7)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            y: {
                beginAtZero: true,
                title: { display: true, text: '着地確率 (%)' }
            },
            x: {
                ticks: { font: { size: 10 } }
            }
        },
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {
                        return `${context.dataset.label}: ${context.raw.toFixed(3)}%`;
                    }
                }
            }
        }
    }
});
</script>

</body>
</html>
